<style>
/* ============================================================
   FUT DOS FILHOS — identidade
   quadra pintada de azul, linhas de cal, número de camisa
   ============================================================ */
:root{
  --tinta:#0A1B36;
  --quadra:#12294D;
  --quadra-esc:#081428;
  --cal:#ffffff;
  --linha:#EDEFF3;
  --borda:#D8DDE6;
  --cinza:#6B7688;
  --canarinho:#C9A24B;
  --pago:#1F9D55;
  --deve:#D64545;
  --raio:14px;
  --sombra:0 1px 2px rgba(16,24,38,.06), 0 8px 24px rgba(16,24,38,.06);
  --display:'Anton','Arial Narrow',Impact,sans-serif;
  --corpo:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--corpo);
  background:var(--linha);
  color:var(--tinta);
  font-size:16px;
  line-height:1.45;
  padding-bottom:calc(28px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--quadra)}

/* ---------- cabeçalho: faixa de quadra ---------- */
.topo{
  background:var(--quadra);
  color:#fff;
  padding:14px 16px 16px;
  position:relative;
  overflow:hidden;
}
.topo::after{ /* fio dourado do escudo */
  content:'';position:absolute;left:0;right:0;bottom:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--canarinho) 22%,#F0DFA8 50%,var(--canarinho) 78%,transparent);
}
.topo-linha{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.brasao{width:54px;height:auto;flex:none;filter:drop-shadow(0 3px 7px rgba(0,0,0,.4))}
.marca-bloco{min-width:0;flex:1}
.marca{font-family:var(--display);font-size:23px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.marca span{color:var(--canarinho)}
.lema{font-size:10.5px;letter-spacing:1.7px;text-transform:uppercase;font-weight:600;color:var(--canarinho);margin-top:3px;opacity:.9}
.chave{
  margin-left:auto;background:rgba(255,255,255,.14);border-radius:999px;
  padding:6px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px
}
.chave.on{background:var(--canarinho);color:var(--tinta)}
@media (max-width:400px){ .chave span{display:none} .chave{padding:8px 10px} .marca{font-size:20px} .brasao{width:48px}
  .aba{font-size:8.5px;letter-spacing:0;padding:8px 1px 0} .aba i{font-size:15px} .aba em{padding-bottom:7px} }
.eu{margin-top:12px;position:relative;z-index:1}
.eu label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;opacity:.75;margin-bottom:5px;font-weight:600}
.eu select{
  width:100%;padding:11px 12px;border-radius:10px;border:none;
  background:rgba(255,255,255,.95);color:var(--tinta);font-weight:600;appearance:none;
}

/* ---------- navegação ---------- */
.abas{
  position:sticky;top:0;z-index:50;
  background:var(--cal);border-bottom:1px solid var(--borda);
  display:grid;grid-template-columns:repeat(7,minmax(44px,1fr));overflow-x:auto;
  box-shadow:0 2px 10px rgba(16,24,38,.05);
}
.aba{
  padding:9px 4px 0;text-align:center;font-size:11px;font-weight:600;
  color:var(--cinza);letter-spacing:.4px;text-transform:uppercase;
  border-bottom:3px solid transparent;
}
.aba.on{color:var(--quadra);border-bottom-color:var(--quadra)}
.aba i{display:block;font-size:19px;font-style:normal;margin-bottom:1px}
.aba em{display:block;font-style:normal;padding-bottom:8px}

.tela{padding:16px;max-width:760px;margin:0 auto;display:none}
.tela.on{display:block}

/* ---------- blocos ---------- */
.cartao{background:var(--cal);border-radius:var(--raio);box-shadow:var(--sombra);padding:16px;margin-bottom:14px}
.titulo{
  font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--cinza);margin-bottom:10px;display:flex;align-items:center;gap:8px
}
.titulo::after{content:'';flex:1;height:1px;background:var(--borda)}

/* ---------- destaque do próximo jogo ---------- */
.jogo-capa{background:var(--tinta);color:#fff;border-radius:var(--raio);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.jogo-capa::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--canarinho) 0 18px,transparent 18px 36px)}
.jogo-quando{font-family:var(--display);font-size:40px;line-height:.95;text-transform:uppercase;letter-spacing:.5px}
.jogo-quando em{font-style:normal;color:var(--canarinho)}
.jogo-onde{margin-top:8px;font-size:15px;opacity:.85}
.jogo-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{background:rgba(255,255,255,.12);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600}
.tag.destaque{background:var(--canarinho);color:var(--tinta)}

.capa-bloco{margin-top:16px;padding-top:13px;border-top:1px solid rgba(201,162,75,.4)}
.capa-rot{font-size:10.5px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;color:var(--canarinho)}
.capa-pix{display:flex;align-items:center;gap:10px;margin-top:7px}
.capa-pix code{font-family:var(--corpo);font-size:16.5px;font-weight:600;word-break:break-all;flex:1;line-height:1.25}
.btn-ouro{background:var(--canarinho);color:var(--tinta);padding:9px 15px;border-radius:9px;font-weight:700;font-size:13px;flex:none}
.btn-ouro:active{transform:scale(.97)}
.capa-eu{display:flex;align-items:baseline;gap:10px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);font-size:13.5px}
.capa-eu span{opacity:.8}
.capa-eu b{margin-left:auto;font-size:15px;white-space:nowrap}
.capa-eu b.ok{color:#7BE0A4}
.capa-eu b.pend{color:#FF9E9E}

.acoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.btn{
  padding:15px 12px;border-radius:12px;font-weight:700;font-size:15px;text-align:center;
  border:2px solid transparent;transition:transform .08s ease;
}
.btn:active{transform:scale(.98)}
.btn-vou{background:var(--pago);color:#fff}
.btn-vou.on{box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.btn-fora{background:var(--cal);color:var(--deve);border-color:var(--deve)}
.btn-fora.on{background:var(--deve);color:#fff}
.btn-sec{background:var(--cal);border:1px solid var(--borda);padding:10px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn-main{background:var(--quadra);color:#fff;padding:12px 16px;border-radius:10px;font-weight:700}
.btn-linha{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn-zap{background:#25D366;color:#06331C;padding:13px 16px;border-radius:10px;font-weight:700;font-size:15px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.btn-zap:active{transform:scale(.98)}
a.btn-sec{text-decoration:none;display:inline-flex;align-items:center;color:var(--tinta)}

/* ---------- A LISTA (assinatura) ---------- */
.lista{list-style:none}
.vaga{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--borda)}
.vaga:last-child{border-bottom:none}
.num{
  font-family:var(--display);font-size:26px;line-height:1;width:38px;flex:none;text-align:center;
  color:var(--quadra);
}
.vaga.livre .num{color:var(--borda)}
.vaga.livre .nome{color:var(--cinza);font-style:italic;font-size:14px}
.vaga-corpo{flex:1;min-width:0}
.nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:12.5px;color:var(--cinza)}
.selo{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:4px 9px;border-radius:999px;flex:none}
.selo.pago{background:#E4F5EA;color:var(--pago)}
.selo.deve{background:#FCE8E8;color:var(--deve)}
.selo.neutro{background:var(--linha);color:var(--cinza)}
.selo.convidado{background:#FFF3D1;color:#8A6100}
.selo.gol{background:#E2F0EA;color:#186A4B}
.check{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--borda);
  border-radius:10px;cursor:pointer;background:var(--cal)}
.check input{width:20px;height:20px;accent-color:var(--quadra);flex:none;margin:0}
.check b{font-weight:600}
.check .sub{margin-top:2px}
.check:has(input:checked){border-color:var(--quadra);background:#F3F7FC}
.grupo-rot{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;color:var(--cinza);
  margin:14px 0 2px;padding:5px 9px;background:var(--linha);border-radius:6px}
.grupo-rot:first-child{margin-top:4px}
.grupo-rot.atraso{background:#FCE8E8;color:var(--deve)}
.selo[data-clique]{cursor:pointer}
.eu-mesmo{background:#FFF8E3;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}

.foras{display:flex;flex-wrap:wrap;gap:6px}
.fora-chip{background:var(--linha);color:var(--cinza);border-radius:999px;padding:5px 11px;font-size:13px}

/* ---------- pix ---------- */
/* ---------- listas genéricas ---------- */
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--borda)}
.item[data-abrir-jogo]{cursor:pointer}
.item[data-abrir-jogo]:hover{background:var(--linha);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:8px}
.seta{color:var(--borda);font-size:20px;flex:none}
.selo[disabled]{opacity:.3}
.faixa-rodada{display:flex;align-items:center;gap:10px;background:var(--tinta);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}
.faixa-rodada button{margin-left:auto;background:rgba(255,255,255,.16);color:#fff;padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;flex:none}
.item:last-child{border-bottom:none}
.item-corpo{flex:1;min-width:0}
.valor{font-weight:700;white-space:nowrap}
.valor.neg{color:var(--deve)}
.valor.pos{color:var(--pago)}
.data-caixa{
  font-family:var(--display);text-align:center;width:46px;flex:none;line-height:1;
  color:var(--quadra);border-right:2px solid var(--borda);padding-right:10px
}
.data-caixa b{display:block;font-size:22px;font-weight:400}
.data-caixa span{font-size:11px;letter-spacing:.5px}

/* ---------- caixa ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--cal);border-radius:var(--raio);padding:14px;box-shadow:var(--sombra)}
.kpi.forte{grid-column:1/-1;background:var(--quadra);color:#fff}
.kpi b{display:block;font-family:var(--display);font-size:30px;line-height:1.1;margin-top:4px;font-weight:400}
.kpi small{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:600;opacity:.7}
.barra-linha{margin:12px 0}
.barra-topo{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}
.barra{height:9px;background:var(--linha);border-radius:99px;overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.barra .b-in{background:var(--pago)}
.barra .b-out{background:var(--deve);opacity:.35}

/* ---------- formulários ---------- */
.campo{margin-bottom:12px}
.campo label{display:block;font-size:12px;font-weight:600;color:var(--cinza);margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px}
.campo input,.campo select{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;background:var(--cal)}
.campo input:focus,.campo select:focus{outline:2px solid var(--quadra);outline-offset:1px;border-color:var(--quadra)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(16,24,38,.55);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal-caixa{background:var(--cal);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px;max-height:88vh;overflow-y:auto}
.modal-topo{display:flex;align-items:center;margin-bottom:14px}
.modal-topo h2{font-family:var(--display);font-size:22px;font-weight:400;text-transform:uppercase;letter-spacing:.5px}
.modal-topo button{margin-left:auto;font-size:22px;color:var(--cinza);line-height:1}


.roleta-caixa{position:relative;display:flex;justify-content:center;margin:4px 0 16px}
.roleta{width:100%;max-width:330px;height:auto;display:block}
.roleta-seta{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:2;
  font-size:26px;line-height:1;color:var(--canarinho);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.roleta-centro{fill:var(--cal);stroke:var(--canarinho);stroke-width:3}
.btn-girar{background:var(--canarinho);color:var(--tinta);width:100%;padding:16px;border-radius:12px;
  font-family:var(--display);font-size:20px;letter-spacing:1.5px;text-transform:uppercase;
  transition:transform .08s ease}
.btn-girar:active{transform:scale(.98)}
.btn-girar:disabled{opacity:.55;cursor:default}

.times-grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.time{background:var(--cal);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden}
.time-topo{padding:10px 12px;font-family:var(--display);font-size:15px;letter-spacing:.8px;
  text-transform:uppercase;color:#fff;display:flex;align-items:center;gap:6px}
.time.vermelho .time-topo{background:#C0392B}
.time.colete .time-topo{background:#E0A417;color:#3B2A00}
.time-topo b{margin-left:auto;font-weight:400;opacity:.85;font-size:13px}
.time ol{list-style:none;padding:6px 12px 12px}
.time li{padding:6px 0;border-bottom:1px solid var(--borda);font-size:14.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.time li:last-child{border-bottom:none}
.time li.novo{animation:entra .45s ease}
@keyframes entra{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.time .vazio-time{padding:14px 12px;color:var(--cinza);font-size:13.5px;font-style:italic}

.visao-capa{background:var(--tinta);color:#fff;border-radius:var(--raio);padding:22px 20px 24px;
  margin-bottom:14px;position:relative;overflow:hidden;text-align:center}
.visao-capa::after{content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--canarinho) 0 18px,transparent 18px 36px)}
.visao-rot{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--canarinho);
  font-weight:700;margin-bottom:12px}
.visao-txt{font-size:17px;line-height:1.45;font-weight:600}
.visao-cruz{font-size:22px;color:var(--canarinho);margin-bottom:8px;line-height:1}

.vlr{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--borda)}
.vlr:last-child{border-bottom:none}
.vlr-num{font-family:var(--display);font-size:20px;line-height:1.1;color:var(--canarinho);width:26px;flex:none}
.vlr-corpo{flex:1;min-width:0}
.vlr-nome{display:block;font-family:var(--display);font-size:14.5px;font-weight:400;letter-spacing:.8px;
  text-transform:uppercase;color:var(--quadra);margin-bottom:2px}
.vlr-desc{font-size:14.5px;line-height:1.4}

.est-tit{font-family:var(--display);font-size:17px;font-weight:400;text-transform:uppercase;letter-spacing:.6px;
  color:var(--quadra);margin:22px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--canarinho)}
.est-tit:first-child{margin-top:0}
.est-p{margin:0 0 10px;font-size:15px}
.est-lista{list-style:none;margin:0 0 12px}
.est-lista li{position:relative;padding-left:20px;margin-bottom:7px;font-size:15px}
.est-lista li::before{content:'';position:absolute;left:4px;top:9px;width:7px;height:7px;
  border-radius:50%;background:var(--canarinho)}
.campo textarea{width:100%;padding:11px 12px;border:1px solid var(--borda);border-radius:10px;
  background:var(--cal);font-size:14px;line-height:1.5;min-height:340px;resize:vertical}
.campo textarea:focus{outline:2px solid var(--quadra);outline-offset:1px;border-color:var(--quadra)}

.vazio{text-align:center;padding:26px 14px;color:var(--cinza)}
.vazio b{display:block;font-family:var(--display);font-size:19px;color:var(--tinta);font-weight:400;margin-bottom:6px;text-transform:uppercase}
.aviso{background:#FFF8E3;border-left:3px solid var(--canarinho);padding:11px 13px;border-radius:0 8px 8px 0;font-size:13.5px;margin-bottom:14px}
.aviso.grave{background:#FCE8E8;border-left-color:var(--deve)}
.versao{text-align:center;font-size:11px;color:var(--cinza);margin-top:14px;letter-spacing:.4px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:200;
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
.toast.on{opacity:1}

@media (min-width:720px){
  .abas{display:flex;justify-content:center;gap:4px}
  .aba{padding:14px 22px 11px;font-size:12px}
  .aba i{display:inline;margin-right:7px;font-size:15px;vertical-align:-1px}
  .aba em{display:inline;padding-bottom:0}
  .modal{align-items:center}
  .modal-caixa{border-radius:18px}
  .jogo-quando{font-size:52px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

      }, erroFirebase);
      fs.onSnapshot(fs.collection(db,"jogos"), s => {
        estado.jogos = s.docs.map(d => ({ id:d.id, ...d.data() })); desenhar();
      }, erroFirebase);
      fs.onSnapshot(fs.collection(db,"despesas"), s => {
        estado.despesas = s.docs.map(d => ({ id:d.id, ...d.data() })); desenhar();
      }, erroFirebase);
      fs.onSnapshot(fs.doc(db,"config","geral"), d => {
        if (d.exists()) estado.config = { ...estado.config, ...d.data() }; desenhar();
      }, erroFirebase);
    } catch (e) {
      console.error(e);
      avisar("Não consegui conectar no Firebase. Confira a configuração.");
      semear();
    }
  } else {
    semear();
  }
  lerEndereco();
  desenhar();
}
function erroFirebase(e){
  console.error(e);
  avisar("Sem permissão para ler os dados. Revise as regras do Firestore.");
}

const novoId = () => (crypto.randomUUID ? crypto.randomUUID() : "id"+Date.now()+Math.random().toString(16).slice(2));

async function gravar(colecao, dados, id){
  if (fb) {
    const { fs, db } = fb;
    if (id) { await fs.setDoc(fs.doc(db,colecao,id), dados, { merge:true }); return id; }
    const ref = await fs.addDoc(fs.collection(db,colecao), dados); return ref.id;
  }
  const lista = estado[colecao];
  if (id) { const i = lista.findIndex(x=>x.id===id); if(i>=0) lista[i] = { ...lista[i], ...dados }; return id; }
  const nid = novoId(); lista.push({ id:nid, ...dados }); return nid;
}
async function apagar(colecao, id){
  if (fb) { await fb.fs.deleteDoc(fb.fs.doc(fb.db,colecao,id)); return; }
  estado[colecao] = estado[colecao].filter(x => x.id !== id);
}
async function gravarConfig(dados){
  estado.config = { ...estado.config, ...dados };
  if (fb) await fb.fs.setDoc(fb.fs.doc(fb.db,"config","geral"), dados, { merge:true });
}

  if (fb) await fb.fs.updateDoc(fb.fs.doc(fb.db,"jogos",jogoId), { ["presencas."+atletaId]: jogo.presencas[atletaId] });

  const presencasDe = (ids, pagos) => {

      presencas: presencasDe([0,1,2,4,5,6,8,9,10,12,13], [0,1,2,4,5,6,8,9,10,12]) },

/* ---------- cálculos ---------- */
const hojeISO = () => new Date().toLocaleDateString("sv-SE");
// ordem de chegada: quem confirmou primeiro pega a vaga primeiro.
// quem confirmou antes desta mudança não tem carimbo e fica no topo, na ordem antiga.
const confirmados = j => Object.entries(j.presencas||{})
  .filter(([,p]) => p.status === "in")
  .sort((a,b) => (a[1].em || 0) - (b[1].em || 0))
  .map(([id]) => id);
const recusados   = j => Object.entries(j.presencas||{}).filter(([,p]) => p.status==="out").map(([id])=>id);

function valorPorJogador(j){
  if (Number(j.valorFixo) > 0) return Number(j.valorFixo);
  const n = confirmados(j).length;
  return n > 0 ? Math.round((Number(j.custo)||0)/n*100)/100 : 0;
}
const recebidoNoJogo = j => confirmados(j).filter(id => j.presencas[id].pago).length * valorPorJogador(j);
const jogosPassados  = () => estado.jogos.filter(j => j.data <= hojeISO());
// só a terça que vem entra na conta; rodadas mais adiante ficam de fora
const proximaRodada  = () => estado.jogos.filter(j => j.data > hojeISO())
                                         .sort((a,b) => a.data.localeCompare(b.data))[0];
const contaNaDivida  = j => j.data <= hojeISO() || j.id === proximaRodada()?.id;

function caixa(){
  // entrada = dinheiro que já pingou, inclusive adiantado da rodada que ainda vem
  const entrou = estado.jogos.reduce((s,j) => s + recebidoNoJogo(j), 0);
  const adiantado = estado.jogos.filter(j => j.data > hojeISO()).reduce((s,j) => s + recebidoNoJogo(j), 0);
  // saída = só o que já foi gasto de fato
  const quadra = jogosPassados().reduce((s,j) => s + (Number(j.custo)||0), 0);
  const extras = estado.despesas.reduce((s,d) => s + (Number(d.valor)||0), 0);
  // a receber = só rodada já jogada; ninguém deve por jogo que ainda não aconteceu
  // a receber = quem marcou o nome e não pagou, contando só até a próxima rodada
  const naoPago = j => confirmados(j).filter(id => !j.presencas[id].pago).length * valorPorJogador(j);
  const atrasado = jogosPassados().reduce((s,j) => s + naoPago(j), 0);
  const prox = proximaRodada();
  const pendente = prox ? naoPago(prox) : 0;
  return { entrou, adiantado, saiu: quadra+extras, quadra, extras,
           saldo: entrou-quadra-extras, aReceber: atrasado+pendente, atrasado, pendente };
}
// quem põe o nome na lista já deve a diária — atrasado é de rodada jogada,
// pendente é da que ainda vem
function saldoAtleta(id){
  let devido = 0, pago = 0, atrasado = 0, pendente = 0;
  const hoje = hojeISO();
  estado.jogos.forEach(j => {
    const p = (j.presencas||{})[id];
    if (!p || p.status !== "in") return;
    if (!contaNaDivida(j)) return;   // confirmou pra daqui a duas semanas? ainda não é dívida
    const v = valorPorJogador(j);
    devido += v;
    if (p.pago) { pago += v; return; }
    if (j.data <= hoje) atrasado += v; else pendente += v;
  });
  return { devido, pago, atrasado, pendente, aberto: atrasado + pendente };
}
const presencasDoAtleta = id => estado.jogos.filter(j => (j.presencas||{})[id]?.status === "in").length;
const presencasJogadas = id => jogosPassados().filter(j => (j.presencas||{})[id]?.status === "in").length;
const situacaoDe = a => a?.situacao || (a?.ativo === false ? "inativo" : "fixo");
const plural = (n, um, varios) => n + " " + (n === 1 ? um : varios);
const atletaDe = id => estado.atletas.find(a => a.id === id);
const ehGoleiro = id => !!atletaDe(id)?.goleiro;
function quemConvidou(id){
  const a = atletaDe(id);
  if (situacaoDe(a) !== "convidado") return "";
  return a.convidadoPor ? "convidado de "+nomeDe(a.convidadoPor) : "convidado";
}

/* ---------- formatação ---------- */
const dinheiro = v => (Number(v)||0).toLocaleString("pt-BR",{ style:"currency", currency:"BRL" });
const asData = iso => new Date(iso+"T12:00:00");
function dataLonga(iso){
  const d = asData(iso);
  const dia = d.toLocaleDateString("pt-BR",{ weekday:"short" }).replace(".","").toUpperCase();
  const mes = d.toLocaleDateString("pt-BR",{ month:"short" }).replace(".","").toUpperCase();
  return { dia, num:String(d.getDate()).padStart(2,"0"), mes };
}
const dataCurta = iso => asData(iso).toLocaleDateString("pt-BR",{ day:"2-digit", month:"2-digit" });
const quandoConfirmou = ms => ms
  ? new Date(ms).toLocaleString("pt-BR",{ day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" })
  : "";
const DIAS = ["Domingo","Segunda-feira","Terça-feira","Quarta-feira","Quinta-feira","Sexta-feira","Sábado"];
function proximoDiaDaSemana(alvo){
  const d = new Date();
  d.setDate(d.getDate() + (((Number(alvo) - d.getDay()) + 7) % 7 || 7));
  return d.toLocaleDateString("sv-SE");
}
const escapar = t => String(t??"").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const nomeDe = id => estado.atletas.find(a => a.id === id)?.nome || "—";

/* ---------- texto para mandar no grupo ---------- */
function textoDaLista(j){
  const d = asData(j.data);
  const diaSem = d.toLocaleDateString("pt-BR",{ weekday:"long" });
  const dentro = confirmados(j), fora = recusados(j);
  const vagas = Number(j.vagas) || 14;
  const titulares = dentro.slice(0, vagas), espera = dentro.slice(vagas);
  const v = valorPorJogador(j);
  const livres = Math.max(0, vagas - titulares.length);
  const marca = id => (j.presencas[id].pago ? "✅" : "⏳");

  const L = [];
  L.push("*⚽ FUT DOS FILHOS*");
  L.push(`${diaSem.charAt(0).toUpperCase()+diaSem.slice(1)}, ${dataCurta(j.data)} · ${j.hora||""}`);
  if (j.local) L.push(j.local);
  L.push(`*${dinheiro(v)} por cabeça* · ${titulares.length}/${vagas} confirmados`);

  L.push("");
  L.push("*NA LISTA*");
  if (titulares.length) titulares.forEach((id,i) =>
    L.push(`${i+1}. ${ehGoleiro(id)?"🧤 ":""}${nomeDe(id)} ${marca(id)}`));
  else L.push("_ninguém confirmou ainda_");
  if (livres) L.push(`_${plural(livres,"vaga livre","vagas livres")}_`);

  if (espera.length) {
    L.push("");
    L.push("*ESPERA*");
    espera.forEach((id,i) => L.push(`${i+1}. ${ehGoleiro(id)?"🧤 ":""}${nomeDe(id)} ${marca(id)}`));
  }
  if (fora.length) {
    L.push("");
    L.push(`*FORA:* ${fora.map(nomeDe).join(", ")}`);
  }

  const gols = titulares.filter(ehGoleiro).length;
  L.push("");
  L.push(gols ? `🧤 ${plural(gols,"goleiro","goleiros")} na lista`
              : "🧤 *Nenhum goleiro confirmado ainda*");

  const faltam = dentro.filter(id => !j.presencas[id].pago).length;
  L.push("");
  L.push("✅ pago  ⏳ falta o Pix" + (faltam ? ` — ${faltam===1?"falta":"faltam"} *${plural(faltam,"pessoa","pessoas")}*` : " — *todos pagaram!*"));
  if (estado.config.pixChave) L.push(`*Pix:* ${estado.config.pixChave}${estado.config.pixNome?" ("+estado.config.pixNome+")":""}`);

  const url = location.href.split("#")[0];
  if (/^https?:/.test(url)) { L.push(""); L.push(`Confirme sua presença: ${url}`); }
  return L.join("\n");
}

async function compartilharTexto(texto){
  if (navigator.share) {
    try { await navigator.share({ text: texto }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const zap = "https://wa.me/?text=" + encodeURIComponent(texto);
  if (!window.open(zap, "_blank", "noopener")) {
    try { await navigator.clipboard.writeText(texto); avisar("Texto copiado — é só colar no grupo."); }
    catch(_) { avisar("Não consegui abrir o WhatsApp."); }
  }
}

function textoIdentidade(){
  const bruto = estado.config.identidade || IDENTIDADE_MODELO;
  const L = ["*⚽ FUT DOS FILHOS*", ""];
  bruto.split("\n").forEach(linha => {
    const l = linha.trim();
    if (!l) { L.push(""); return; }
    if (l.startsWith("## ")) { L.push(`*${l.slice(3).toUpperCase()}*`); return; }
    // no WhatsApp o negrito é um asterisco só
    const zap = l.replace(/\*\*(.+?)\*\*/g, "*$1*");
    L.push(zap.startsWith("- ") ? "• " + zap.slice(2) : zap);
  });
  const url = location.href.split("#")[0];
  if (/^https?:/.test(url)) { L.push(""); L.push(url); }
  return L.join("\n").replace(/\n{3,}/g, "\n\n");
}

async function compartilharLista(jogoId){
  const j = estado.jogos.find(x => x.id === jogoId); if (!j) return;
  const texto = textoDaLista(j);
  if (navigator.share) {
    try { await navigator.share({ text: texto }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const zap = "https://wa.me/?text=" + encodeURIComponent(texto);
  const aberta = window.open(zap, "_blank", "noopener");
  if (!aberta) {
    try { await navigator.clipboard.writeText(texto); avisar("Lista copiada — é só colar no grupo."); }
    catch(_) { avisar("Não consegui abrir o WhatsApp."); }
  }
}

/* ============================================================
   TELA — SORTEIO DE TIMES
   ============================================================ */
const sorteio = { jogoId:null, restantes:[], vermelho:[], colete:[], vez:"vermelho", angulo:0, girando:false, ultimo:null };

const jogoDoSorteio = () => (estado.jogoAberto && estado.jogos.find(j => j.id === estado.jogoAberto))
  || estado.jogos.filter(j => j.data >= hojeISO()).sort((a,b) => a.data.localeCompare(b.data))[0]
  || jogosPassados().sort((a,b) => b.data.localeCompare(a.data))[0];

function prepararSorteio(jogo){
  if (sorteio.jogoId === jogo.id) return;
  sorteio.jogoId = jogo.id;
  sorteio.restantes = confirmados(jogo).slice(0, Number(jogo.vagas)||14);
  sorteio.vermelho = []; sorteio.colete = []; sorteio.vez = "vermelho";
  sorteio.angulo = 0; sorteio.ultimo = null;
}

const primeiroNome = id => {
  const n = nomeDe(id).split(" ")[0];
  return n.length > 11 ? n.slice(0,10)+"…" : n;
};

// enquanto o time da vez não tiver goleiro e sobrar goleiro no pote, a roleta só mostra goleiros
function poolDoGiro(){
  const semGoleiro = !sorteio[sorteio.vez].some(ehGoleiro);
  const golsLivres = sorteio.restantes.filter(ehGoleiro);
  return (semGoleiro && golsLivres.length) ? golsLivres : sorteio.restantes;
}
const faseGoleiro = () => poolDoGiro() !== sorteio.restantes;

function svgRoleta(){
  const ids = poolDoGiro(), n = ids.length, R = 148;
  if (!n) return "";
  const passo = 360/n;
  const rad = g => (g-90) * Math.PI/180;
  const fatias = ids.map((id,i) => {
    const ini = i*passo, fim = ini+passo, meio = ini+passo/2;
    const x1 = R*Math.cos(rad(ini)), y1 = R*Math.sin(rad(ini));
    const x2 = R*Math.cos(rad(fim)), y2 = R*Math.sin(rad(fim));
    const cor = ehGoleiro(id) ? (i % 2 ? "#1E7355" : "#155943") : (i % 2 ? "#16305A" : "#0E2142");
    const tam = n > 14 ? 8.5 : n > 10 ? 10 : 11.5;
    return `<path d="M0 0 L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${passo>180?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z"
              fill="${cor}" stroke="#C9A24B" stroke-width="1"/>
            <text transform="rotate(${meio}) translate(0,-${R*0.62})" fill="#fff" font-size="${tam}"
              font-family="Barlow,sans-serif" font-weight="600" text-anchor="middle"
              dominant-baseline="central">${escapar(primeiroNome(id))}</text>`;
  }).join("");
  return `<div class="roleta-caixa">
    <div class="roleta-seta">▼</div>
    <svg class="roleta" viewBox="-160 -160 320 320" xmlns="http://www.w3.org/2000/svg">
      <g id="roda" style="transform:rotate(${sorteio.angulo}deg)">${fatias}</g>
      <circle class="roleta-centro" r="26"/>
      <text y="1" text-anchor="middle" dominant-baseline="central" font-family="Anton,sans-serif"
        font-size="15" fill="#12294D">${n}</text>
    </svg></div>`;
}

function cartaoTime(classe, rotulo, ids, destaque){
  return `<div class="time ${classe}">
    <div class="time-topo">${rotulo}<b>${ids.length}</b></div>
    ${ids.length ? `<ol>${ids.map(id => `<li class="${id===destaque?"novo":""}">${ehGoleiro(id)?"🧤 ":""}${escapar(nomeDe(id))}</li>`).join("")}</ol>`
                 : `<div class="vazio-time">ninguém ainda</div>`}
  </div>`;
}

function telaTimes(){
  if (sorteio.girando) return;
  const el = document.getElementById("tela-times");
  const jogo = jogoDoSorteio();

  if (!jogo) {
    el.innerHTML = `<div class="cartao"><div class="vazio"><b>Nenhuma rodada</b>
      Marque um jogo na agenda para sortear os times.</div></div>`;
    return;
  }
  const feito = jogo.times && jogo.times.vermelho;
  const { num, mes } = dataLonga(jogo.data);
  const topo = `<div class="aviso">Sorteio da rodada de <b>${num} ${mes}</b>${jogo.local?" · "+escapar(jogo.local):""}.</div>`;

  if (feito) {
    el.innerHTML = topo + `
      <div class="times-grade">
        ${cartaoTime("vermelho","Vermelho",jogo.times.vermelho)}
        ${cartaoTime("colete","Colete",jogo.times.colete)}
      </div>
      <div class="btn-linha" style="margin:0">
        <button class="btn-zap" style="flex:1" data-compartilhar-texto="times">📤 Mandar os times no grupo</button>
        <button class="btn-sec" data-acao="refazer-sorteio">Refazer</button>
      </div>`;
    return;
  }

  prepararSorteio(jogo);
  const dentro = confirmados(jogo).length;
  if (!sorteio.restantes.length) {
    el.innerHTML = topo + `<div class="cartao"><div class="vazio"><b>Lista vazia</b>
      ${dentro?"":"Ninguém confirmou ainda."} O sorteio usa quem está na lista da rodada.</div></div>`;
    return;
  }

  const proximoTime = sorteio.vez === "vermelho" ? "VERMELHO" : "COLETE";
  const gol = faseGoleiro();
  el.innerHTML = topo
    + (gol ? `<div class="aviso" style="background:#E2F0EA;border-left-color:#186A4B">
        🧤 <b>Sorteando o goleiro</b> do time ${proximoTime.toLowerCase()}.</div>` : "")
    + svgRoleta() + `
    <button class="btn-girar" id="btnGirar" data-acao="girar">Girar${gol?" o goleiro":""} → ${proximoTime}</button>
    <div class="sub" style="text-align:center;margin:8px 0 14px">
      ${plural(sorteio.restantes.length,"jogador ainda no sorteio","jogadores ainda no sorteio")}</div>
    <div class="times-grade">
      ${cartaoTime("vermelho","Vermelho",sorteio.vermelho,sorteio.ultimo)}
      ${cartaoTime("colete","Colete",sorteio.colete,sorteio.ultimo)}
    </div>
    <button class="btn-sec" style="width:100%" data-acao="sortear-resto">Sortear o resto de uma vez</button>`;
}

function girarRoleta(){
  if (sorteio.girando || !sorteio.restantes.length) return;
  const pote = poolDoGiro();
  const n = pote.length, passo = 360/n;
  const idx = Math.floor(Math.random()*n);
  const sorteado = pote[idx];
  const voltas = 4 + Math.floor(Math.random()*3);
  const alvo = (((-(idx*passo + passo/2)) % 360) + 360) % 360;
  sorteio.angulo = Math.ceil((sorteio.angulo + 360*voltas)/360)*360 + alvo;
  sorteio.girando = true;

  const roda = document.getElementById("roda");
  const botao = document.getElementById("btnGirar");
  if (botao) { botao.disabled = true; botao.textContent = "girando…"; }
  roda.style.transition = "transform 4.2s cubic-bezier(.16,.68,.18,1)";
  roda.style.transform = `rotate(${sorteio.angulo}deg)`;

  setTimeout(async () => {
    const id = sorteado;
    sorteio.restantes.splice(sorteio.restantes.indexOf(id), 1);
    const time = sorteio.vez;
    sorteio[time].push(id);
    sorteio.ultimo = id;
    sorteio.vez = time === "vermelho" ? "colete" : "vermelho";
    sorteio.girando = false;
    if (!sorteio.restantes.length) await salvarTimes();
    telaTimes();
    avisar(`${ehGoleiro(id)?"🧤 ":""}${nomeDe(id)} → ${time === "vermelho" ? "VERMELHO" : "COLETE"}`);
  }, 4350);
}

async function sortearResto(){
  if (sorteio.girando) return;
  while (sorteio.restantes.length) {
    const pote = poolDoGiro();
    const id = pote[Math.floor(Math.random()*pote.length)];
    sorteio[sorteio.vez].push(id);
    sorteio.restantes.splice(sorteio.restantes.indexOf(id), 1);
    sorteio.vez = sorteio.vez === "vermelho" ? "colete" : "vermelho";
  }
  await salvarTimes();
  telaTimes();
  avisar("Times sorteados.");
}

async function salvarTimes(){
  if (!sorteio.jogoId) return;
  await gravar("jogos", { times: { vermelho:sorteio.vermelho, colete:sorteio.colete, em:Date.now() } }, sorteio.jogoId);
}

async function refazerSorteio(){
  const jogo = jogoDoSorteio(); if (!jogo) return;
  if (!confirm("Refazer o sorteio? Os times atuais somem.")) return;
  await gravar("jogos", { times: null }, jogo.id);
  sorteio.jogoId = null;
  telaTimes(); avisar("Sorteio zerado.");
}

function textoTimes(){
  const jogo = jogoDoSorteio();
  if (!jogo || !jogo.times) return "";
  const { num, mes } = dataLonga(jogo.data);
  const L = ["*⚽ FUT DOS FILHOS — TIMES*", `${num} ${mes}${jogo.hora?" · "+jogo.hora:""}${jogo.local?" · "+jogo.local:""}`, ""];
  L.push("*🔴 TIME VERMELHO*");
  jogo.times.vermelho.forEach((id,i) => L.push(`${i+1}. ${ehGoleiro(id)?"🧤 ":""}${nomeDe(id)}`));
  L.push("");
  L.push("*🟡 TIME DE COLETE*");
  jogo.times.colete.forEach((id,i) => L.push(`${i+1}. ${ehGoleiro(id)?"🧤 ":""}${nomeDe(id)}`));
  return L.join("\n");
}

const IDENTIDADE_MODELO = `## Visão
Ser o maior grupo de futebol evangélico da região, reconhecido por transformar vidas através do esporte e propagar o Evangelho de Cristo dentro e fora dos campos.

## Princípios
- **Cristocentrismo** — Jesus Cristo é o centro de todas as nossas decisões, partidas e reuniões.
- **Fraternidade** — Jogamos para fortalecer os laços fraternos entre os membros através do esporte e da fé.

## Valores
- **Caráter e Integridade** — Jogar de forma limpa, respeitando as regras.
- **Respeito** — Valorizar os companheiros de equipe, adversários, árbitros e torcedores.
- **Autocontrole** — Dominar as emoções, rejeitando brigas, palavrões ou agressões no campo.
- **Unidade** — Agir como um só corpo em Cristo, apoiando quem erra e celebrando em equipe.
- **Humildade** — Reconhecer que o talento vem de Deus e saber ganhar ou perder com graça.
- **Disciplina** — Manter o compromisso com os horários, treinos e momentos de oração.`;

function renderIdentidade(txt){
  const partes = escapar(txt).split(/^## /m).map(t => t.trim()).filter(Boolean);
  return partes.map(bloco => {
    const linhas = bloco.split("\n");
    const titulo = linhas.shift().trim();
    const corpo = linhas.map(l => l.trim()).filter(Boolean);

    if (/^vis[aã]o$/i.test(titulo)) {
      return `<div class="visao-capa">
        <div class="visao-cruz">✝</div>
        <div class="visao-rot">${titulo}</div>
        <div class="visao-txt">${forte(corpo.join(" "))}</div></div>`;
    }

    let n = 0;
    const itens = corpo.map(l => {
      if (!l.startsWith("- ")) return `<p class="est-p">${forte(l)}</p>`;
      n++;
      const m = l.slice(2).match(/^\*\*(.+?)\*\*\s*[—–-]?\s*(.*)$/);
      const nome = m ? m[1] : "";
      const desc = m ? m[2] : l.slice(2);
      return `<div class="vlr"><span class="vlr-num">${String(n).padStart(2,"0")}</span>
        <div class="vlr-corpo">${nome?`<span class="vlr-nome">${nome}</span>`:""}
          <span class="vlr-desc">${forte(desc)}</span></div></div>`;
    }).join("");

    return `<div class="cartao"><h3 class="est-tit">${titulo}</h3>${itens}</div>`;
  }).join("");
}

/* ---------- estatuto ---------- */
const ESTATUTO_MODELO = `## 1. A pelada
Jogamos toda **terça-feira às 20h**. São **14 vagas** por rodada, mais lista de espera.

A rodada só acontece com no mínimo 10 confirmados. Sem esse número até a segunda à noite, o jogo é cancelado e ninguém paga.

## 2. Quem joga
- **Fixo** — é da turma, entra na lista toda semana.
- **Convidado** — entra pelo nome de um fixo. Quem convidou responde pela diária dele.
- **Inativo** — parou de jogar. Sai da lista, o histórico fica guardado.

Convidado que vier três rodadas seguidas pode virar fixo, se a turma topar.

## 3. A lista
- Vale a **ordem de chegada**: quem confirma primeiro pega a vaga.
- Passou das 14, entra na espera, também por ordem.
- Quem desmarca e confirma de novo **volta para o fim da fila**.
- Cancelou depois das 18h de terça? A diária continua devida — a quadra já está paga.
- Vaga que abre é oferecida ao primeiro da espera.

## 4. Dinheiro
- **Confirmar presença gera a diária.** Colocou o nome, deve.
- O valor sai do rateio: custo da quadra dividido pelos que jogaram.
- Pagamento por **Pix até o dia do jogo**.
- Quem tem rodada anterior em aberto só entra na lista depois de acertar.
- Convidado que sumir sem pagar: a conta fica com quem trouxe.

## 5. Em campo
- Chegou 20h, bola rolando. Quem atrasa espera a próxima partida.
- **Sem carrinho.** É pelada, todo mundo trabalha no dia seguinte.
- Time perdedor sai; empate, sai quem está há mais tempo em campo.
- Reclamação com o companheiro fica no campo e acaba junto com o jogo.

## 6. O caixa
- O que sobra fica para bola, colete e a confraternização de fim de ano.
- As contas são abertas: qualquer um vê tudo na aba Caixa.

## 7. Este estatuto
Mudanças são combinadas no grupo e atualizadas aqui pelo organizador.`;

const forte = t => t.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
function renderEstatuto(txt){
  const out = []; let emLista = false;
  const fechar = () => { if (emLista) { out.push("</ul>"); emLista = false; } };
  escapar(txt).split("\n").forEach(bruta => {
    const l = bruta.trim();
    if (!l) { fechar(); return; }
    if (l.startsWith("## ")) { fechar(); out.push(`<h3 class="est-tit">${forte(l.slice(3))}</h3>`); }
    else if (l.startsWith("- ")) {
      if (!emLista) { out.push('<ul class="est-lista">'); emLista = true; }
      out.push(`<li>${forte(l.slice(2))}</li>`);
    } else { fechar(); out.push(`<p class="est-p">${forte(l)}</p>`); }
  });
  fechar();
  return out.join("");
}

function formFechamento(jogo){
  const rascunho = {};
  Object.entries(jogo.presencas||{}).forEach(([k,v]) => rascunho[k] = { ...v });
  const elegiveis = estado.atletas
    .filter(a => situacaoDe(a) !== "inativo" || rascunho[a.id])
    .sort((a,b) => a.nome.localeCompare(b.nome,"pt-BR"));

  const jogaram = () => Object.values(rascunho).filter(p => p.status === "in").length;
  const valorDe = () => {
    if (Number(jogo.valorFixo) > 0) return Number(jogo.valorFixo);
    const n = jogaram();
    return n > 0 ? Math.round((Number(jogo.custo)||0)/n*100)/100 : 0;
  };

  const { num, mes } = dataLonga(jogo.data);
  abrirModal(`Rodada de ${num} ${mes}`, `
    <div class="aviso" id="fch_resumo"></div>
    <div class="btn-linha" style="margin:0 0 8px">
      <button class="btn-sec" id="fch_todos_pagos">Todos pagaram</button>
      <button class="btn-sec" id="fch_limpar">Limpar a lista</button>
    </div>
    <div id="fch_lista"></div>
    <div class="btn-linha" style="position:sticky;bottom:0;background:var(--cal);padding:12px 0 0">
      <button class="btn-main" style="flex:1" id="fch_salvar">Salvar rodada</button>
    </div>`);

  function pintar(){
    const dentro = jogaram();
    const pagos = Object.values(rascunho).filter(p => p.status === "in" && p.pago).length;
    const v = valorDe();
    document.getElementById("fch_resumo").innerHTML =
      `<b>${plural(dentro,"jogador","jogadores")}</b> · ${dinheiro(v)} por cabeça · recebido ${dinheiro(pagos*v)} de ${dinheiro(dentro*v)}` +
      (Number(jogo.valorFixo) > 0 ? "" : "<br><span class='sub'>No rateio, o valor por cabeça muda conforme você marca quem jogou.</span>");

    document.getElementById("fch_lista").innerHTML = elegiveis.map(a => {
      const p = rascunho[a.id] || {};
      const dentro = p.status === "in";
      return `<div class="item">
        <div class="item-corpo"><div class="nome">${escapar(a.nome)}</div>
          ${quemConvidou(a.id) ? `<div class="sub">${escapar(quemConvidou(a.id))}</div>` : ""}</div>
        <button class="selo ${dentro?"pago":"neutro"}" data-fch-jogou="${a.id}">${dentro?"jogou":"fora"}</button>
        <button class="selo ${p.pago?"pago":"deve"}" data-fch-pagou="${a.id}" ${dentro?"":"disabled"}>${p.pago?"pago":"a pagar"}</button>
      </div>`;
    }).join("");
  }

  document.getElementById("fch_lista").addEventListener("click", e => {
    const b = e.target.closest("[data-fch-jogou],[data-fch-pagou]");
    if (!b || b.disabled) return;
    const id = b.dataset.fchJogou || b.dataset.fchPagou;
    const p = rascunho[id] = rascunho[id] || {};
    if (b.dataset.fchJogou) {
      p.status = p.status === "in" ? null : "in";
      if (p.status === "in") p.em = p.em || Date.now();
      else p.pago = false;
    } else {
      p.pago = !p.pago;
      p.pagoEm = p.pago ? hojeISO() : null;
    }
    pintar();
  });
  document.getElementById("fch_todos_pagos").onclick = () => {
    Object.values(rascunho).forEach(p => { if (p.status === "in") { p.pago = true; p.pagoEm = hojeISO(); } });
    pintar();
  };
  document.getElementById("fch_limpar").onclick = () => {
    if (!confirm("Tirar todo mundo da lista desta rodada?")) return;
    Object.keys(rascunho).forEach(k => delete rascunho[k]);
    pintar();
  };
  document.getElementById("fch_salvar").onclick = async () => {
    await gravarPresencasTodas(jogo.id, rascunho);
    fecharModal(); desenhar();
    avisar(`Rodada salva: ${plural(jogaram(),"jogador","jogadores")}.`);
  };
  pintar();
}

};

document.body.addEventListener("click", async e => {
  const alvo = e.target.closest("[data-confirmar],[data-pagar],[data-copiar],[data-acao],[data-editar-jogo],[data-editar-atleta],[data-apagar-despesa],[data-abrir-jogo],[data-fechar],[data-compartilhar],[data-compartilhar-texto]");
  if (!alvo) return;
  const d = alvo.dataset;

  if (d.confirmar) {
    if (!estado.eu) return avisar("Escolha seu nome lá em cima primeiro.");
    const jogo = estado.jogos.find(j => j.id === d.jogo);
    const atual = (jogo.presencas||{})[estado.eu]?.status;
    const novo = atual === d.confirmar ? null : d.confirmar;
    await gravarPresenca(d.jogo, estado.eu, {
      status:novo,
      pago:(jogo.presencas||{})[estado.eu]?.pago||false,
      em: novo === "in" ? Date.now() : null   // saiu e voltou? vai para o fim da fila
    });
    desenhar();
    avisar(novo === "in" ? "Confirmado. Bola pra frente." : novo === "out" ? "Anotado, fica pra próxima." : "Presença desmarcada.");
  }
  else if (d.pagar) {
    const jogo = estado.jogos.find(j => j.id === d.jogo);
    const p = jogo.presencas[d.pagar];
    await gravarPresenca(d.jogo, d.pagar, { pago: !p.pago, pagoEm: !p.pago ? hojeISO() : null });
    desenhar();
    avisar(!p.pago ? nomeDe(d.pagar)+" pagou." : "Pagamento desmarcado.");
  }
  else if (d.copiar) {
    try { await navigator.clipboard.writeText(d.copiar); avisar("Chave Pix copiada."); }
    catch(_) { avisar("Copie manualmente: "+d.copiar); }
  }
  else if (d.compartilhar) await compartilharLista(d.compartilhar);
  else if (d.abrirJogo)  { estado.jogoAberto = d.abrirJogo; irPara("jogo"); desenhar(); }
  else if (d.fechar)       formFechamento(estado.jogos.find(j => j.id === d.fechar));
  else if (d.editarJogo)   formJogo(estado.jogos.find(j => j.id === d.editarJogo));
  else if (d.editarAtleta) formAtleta(estado.atletas.find(a => a.id === d.editarAtleta));
  else if (d.apagarDespesa){ if (confirm("Apagar esta despesa?")) { await apagar("despesas", d.apagarDespesa); desenhar(); } }
  else if (d.acao === "novo-jogo")    formJogo(null);
  else if (d.acao === "novo-atleta")  formAtleta(null);
  else if (d.acao === "nova-despesa") formDespesa();
  else if (d.acao === "ajustes")      formAjustes();
  else if (d.acao === "editar-estatuto")  formDocumento("estatuto","Estatuto da pelada",ESTATUTO_MODELO);
  else if (d.acao === "editar-identidade") formDocumento("identidade","Visão, princípios e valores",IDENTIDADE_MODELO);
  else if (d.compartilharTexto === "identidade") await compartilharTexto(textoIdentidade());
  else if (d.compartilharTexto === "times")      await compartilharTexto(textoTimes());
  else if (d.acao === "girar")            girarRoleta();
  else if (d.acao === "sortear-resto")    await sortearResto();
  else if (d.acao === "refazer-sorteio")  await refazerSorteio();
  else if (d.acao === "ver-proxima") { estado.jogoAberto = null; desenhar(); }
});

iniciar();
if (!CONECTADO) setTimeout(() => avisar("Modo demonstração — nada é salvo ainda."), 900);
</script>
</body>
</html>
